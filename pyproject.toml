[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-record"
version = "1.0.0"
description = "基于 OCR 与大模型（LLM）的简历投递记录自动归档工具"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "paddlepaddle==2.6.2",
    "paddleocr==2.8.1",
    "openpyxl>=3.1.0",
    "python-dotenv>=1.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.uv]
# 扁平脚本项目，不需要把本项目作为包安装，只管理依赖
package = false

[tool.setuptools]
# 项目为扁平脚本结构，无需要打包的 Python 包
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
